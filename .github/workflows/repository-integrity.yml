name: Repository integrity

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  whitespace:
    name: Whitespace
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed lines for whitespace errors
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # A force-push can make github.event.before unreachable before the
            # runner checks out the new tip. Check the new tip's own change.
            if PARENT_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null)"; then
              BASE_SHA="$PARENT_SHA"
            else
              BASE_SHA="$(git hash-object -t tree /dev/null)"
            fi
          fi

          git diff --check "$BASE_SHA" "$HEAD_SHA"
