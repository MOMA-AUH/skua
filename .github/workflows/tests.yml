name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        pysam: ["current"]
        include:
          - python-version: "3.11"
            pysam: "0.22.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Install minimum supported pysam
        if: matrix.pysam != 'current'
        env:
          PYSAM_VERSION: ${{ matrix.pysam }}
        run: python -m pip install "pysam==$PYSAM_VERSION"

      - name: Run tests
        run: pytest
