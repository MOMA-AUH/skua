{% set name = "skua" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=69
    - wheel
  run:
    - python >=3.11
    - pysam >=0.22

test:
  source_files:
    - tests/artifact_smoke.py
  imports:
    - skua
  commands:
    - skua annotate --help
    - python -I tests/artifact_smoke.py --expected-version {{ version }}

about:
  home: https://github.com/MOMA-AUH/skua
  summary: Shearwater-based evidence annotation for supplied small variants in targeted sequencing data
  license: MIT
  license_file: LICENSE
